<!DOCTYPE html>

  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- ===== SHARED HEADER (repeat on every page) ===== -->
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="index.html">
        Electra&nbsp;Satchel
        <span class="site-subtitle">Digital Arts and Cinema</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="lost-and-found.html">Lost&nbsp;and&nbsp;Found</a>
        <a href="games.html">Games</a>
        <a href="contact.html" class="active" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>



  <main>
    <div class="container">

      <h1>Get in touch</h1>
      <p>Commissions, questions, or just to say hello, drop a message below.</p>

      <!--TODO:Need to replace with an endpoint before pushing-->
      <form class="contact-form"
            action="REPLACE_WITH_YOUR_FORM_ENDPOINT"
            method="POST">

        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div>
          <button type="submit" class="button">Send message</button>
        </div>
      </form>

    </div>
  </main>


 
  <footer class="site-footer">
    <p>© 2026 — Electra Satchel, Alexandros Gavrilis</p>
  </footer>

</body>
